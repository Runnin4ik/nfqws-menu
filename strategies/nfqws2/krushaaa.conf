# Provider network interface, e.g. eth3
# general (krushaaa).conf
ISP_INTERFACE="ppp0"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua \
                 --blob=quic_steam:@/opt/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin \
                 --blob=quic_lol:@/opt/etc/nfqws2/blobs/quic_initial_leagueoflegends.com.bin \
                 --blob=tls_burger:@/opt/etc/nfqws2/blobs/tls_burgerkingrus_ru.bin \
                 --blob=tls_magnit:@/opt/etc/nfqws2/blobs/tls_magnit.bin
                 --blob=stun2_fake:@/opt/etc/nfqws2/blobs/stun2.bin \
                 --blob=discord_udp:@/opt/etc/nfqws2/blobs/ACTIVE_DISCORD_UDP.bin \
                 --blob=game_udp:@/opt/etc/nfqws2/blobs/ACTIVE_GAME_UDP.bin"

# HTTP(S) strategy  <- профиль --filter-tcp=80,443 из .bat
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls \
            --payload=tls_client_hello \
            --lua-desync=fake:blob=stun2_fake:repeats=4:tcp_ts=-600000:tcp_ts_up \
            --lua-desync=fake:blob=tls_burger:repeats=4:tcp_ts=-600000:tcp_ts_up \
            --payload=http_req \
            --lua-desync=fake:blob=tls_burger:repeats=4:tcp_ts=-600000:tcp_ts_up"
            
# QUIC strategy  <- профиль --filter-udp=443 из .bat
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic \
                 --payload=quic_initial \
                 --lua-desync=fake:blob=quic_lol:repeats=4"

# UDP strategy  <- профиль Discord voice / STUN из .bat
NFQWS_ARGS_UDP="--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun,unknown \
                --payload=discord_ip_discovery,stun \
                --lua-desync=fake:blob=quic_steam:repeats=4 \
                --lua-desync=fake:blob=discord_udp:repeats=4 \
                --payload=unknown \
                --lua-desync=fake:blob=quic_steam:payload=unknown:repeats=4 \
                --lua-desync=fake:blob=discord_udp:payload=unknown:repeats=4"

# Working modes
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"

# IP-lists
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments
NFQWS_ARGS_CUSTOM="
               #Discord
               --filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls \
               --hostlist-domains=discord.media \
               --payload=tls_client_hello \
               --lua-desync=fake:blob=tls_magnit:repeats=4:tcp_ts=-600000:tcp_ts_up \
               --lua-desync=hostfakesplit:host=mail.ru:tcp_ts=-600000:tcp_ts_up \
               --new \
               --filter-tcp=443 --filter-l7=tls \
               --hostlist=/opt/etc/nfqws2/lists/google.list \
               --payload=tls_client_hello \
               --lua-desync=hostfakesplit:host=www.microsoft.com:ip_id=zero:tcp_ts=-600000:tcp_ts_up
               #GameFilter
               --new \
               --filter-tcp=1024-2052,2054-2082,2084-2086,2088-2095,2097-8442,8444-65535 \
               --ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list \
               --out-range=<n4 --payload=known,unknown \
               --lua-desync=fake:blob=stun2_fake:payload=~empty:repeats=4:tcp_ts=-600000:tcp_ts_up \
               --lua-desync=fake:blob=tls_magnit:payload=~empty:repeats=4:tcp_ts=-600000:tcp_ts_up \
               --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_max:payload=~empty \
               --new \
               --filter-udp=1024-19293,19345-49999,50101-65535 \
               --ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list \
               --out-range=<n4 --payload=known,unknown \
               --lua-desync=fake:blob=game_udp:payload=~empty:repeats=4
               #DNS
               --new
               --filter-tcp=443,853 --filter-l7=tls
               --hostlist-domains=dot.pub,doh.pub,controld.com,opendns.com,anycast.censurfridns.dk,dns.alidns.com,libredns.gr,cloudflare-dns.com,one.one.one.one,opennameserver.org,cleanbrowsing.org,dns.adguard-dns.com,dns.comss.one,dns.nextdns.io,freedns.controld.com,dns10.quad9.net,dns.google
               --out-range=-d10
               --payload=tls_client_hello
               --lua-desync=circular:fails=2:time=60:retrans=3:nld=2
               --lua-desync=multisplit:pos=sniext+2:seqovl=3:padencap
               --lua-desync=fake:blob=fake_default_tls:optional:tcp_seq=-10000:tcp_ack=-66000:badsum:tls_mod=rnd,dupsid,sni=rzd.ru:repeat=5
               --new
               --filter-udp=853 --filter-l7=quic
               --hostlist-domains=dns.adguard-dns.com,dns.nextdns.io,one.one.one.one,p2.freedns.controld.com,dns.dynx.pro,dns.quad9.net
               --payload=quic_initial
               --lua-desync=send:ipfrag:ipfrag_pos_udp=128
               --lua-desync=fake:blob=game_udp:payload=~empty:repeats=4
               "

# IPv6 support
IPV6_ENABLED=1

# TCP ports for iptables rules
TCP_PORTS=80,443,853,2053,2083,2087,2096,8443

# UDP ports for iptables rules
UDP_PORTS=443,853,19294:19344,50000:50100

# Keenetic policy name
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
